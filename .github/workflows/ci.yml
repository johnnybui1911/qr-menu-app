name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium is needed by the browser tier inside `npm test` (Vitest browser mode) and by the e2e step.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:console
      - run: npm run test:artifacts
      - run: npm run build:storefront
      - run: npm run test:e2e

  deploy:
    needs: verify
    # Manual only until production is provisioned (R2 bucket, Cloudflare secrets, CLOUDFLARE_API_TOKEN — see
    # docs/next-steps-go-live.md). Origins come from repository variables CONSOLE_ORIGIN / STOREFRONT_ORIGIN and are
    # injected by scripts/deploy-worker.ts (never committed — D21); it refuses to deploy if either is missing or not a
    # bare https origin. To deploy on every push to main, change `if:` to
    # `github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')`.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONSOLE_ORIGIN: ${{ vars.CONSOLE_ORIGIN }}
      STOREFRONT_ORIGIN: ${{ vars.STOREFRONT_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations land before code; storefront deploys before console (console needs STOREFRONT_ORIGIN live).
      # Precondition: qr-menu-app-db exists and its database_id is committed in wrangler.jsonc (created once with
      # `wrangler d1 create qr-menu-app-db`); migrations target that id.
      - run: npm run db:migrate:remote
      - run: npm run deploy:storefront
      - run: npm run deploy:console
