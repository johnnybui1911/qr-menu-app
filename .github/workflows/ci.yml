name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium is needed by the browser tier inside `npm test` (Vitest browser mode) and by the e2e step.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:console
      - run: npm run test:artifacts
      - run: npm run build:storefront
      - run: npm run test:e2e

  deploy:
    needs: verify
    # Manual only until production is provisioned (D1/R2 created, database_id in wrangler.jsonc, real
    # CONSOLE_ORIGIN/STOREFRONT_ORIGIN, Cloudflare secrets, VITE_STOREFRONT_API_BASE_URL for the storefront build —
    # see docs/runbook-cutover.md). Restore `|| github.ref == 'refs/heads/main'` to deploy on every push to main.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations land before code; storefront deploys before console (console needs STOREFRONT_ORIGIN live).
      # Precondition: qr-menu-app-db already exists (`wrangler d1 create qr-menu-app-db`, one time); migrations resolve
      # it by name and do not auto-provision it.
      - run: npm run db:migrate:remote
      - run: npm run deploy:storefront
      - run: npm run deploy:console
